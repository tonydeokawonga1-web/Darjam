name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync web bundle
        env:
          DARJAM_API_BASE: ${{ vars.DARJAM_API_BASE }}
          DARJAM_ADMOB_BANNER: ${{ vars.DARJAM_ADMOB_BANNER }}
          DARJAM_ADMOB_INTERSTITIAL: ${{ vars.DARJAM_ADMOB_INTERSTITIAL }}
          DARJAM_ADMOB_TEST: ${{ vars.DARJAM_ADMOB_TEST || '1' }}
        run: node scripts/build-mobile.mjs --api-base "$DARJAM_API_BASE" --ads

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DARJAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No DARJAM_KEYSTORE_BASE64 secret set — building an unsigned AAB."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/darjam-release.keystore"
          echo "DARJAM_KEYSTORE=$RUNNER_TEMP/darjam-release.keystore" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed AAB
        env:
          DARJAM_KEYSTORE_PASSWORD: ${{ secrets.DARJAM_KEYSTORE_PASSWORD }}
          DARJAM_KEY_ALIAS: ${{ secrets.DARJAM_KEY_ALIAS }}
          DARJAM_KEY_PASSWORD: ${{ secrets.DARJAM_KEY_PASSWORD }}
          DARJAM_VERSION_CODE: ${{ github.run_number }}
          DARJAM_VERSION_NAME: ${{ vars.DARJAM_VERSION_NAME || '1.0.0' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: darjam-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
